services:
  - type: web
    name: rapidaid-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rapidaid-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true

databases:
  - name: rapidaid-db
    databaseName: rapidaid
    user: rapidaid_user
